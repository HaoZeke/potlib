# Meson native file: suppress Fortran language detection.
#
# meson.build gates the CuH2 potential on `add_languages('fortran', required: false)`,
# and that branch pulls `subproject('fortcuh2')`, which resolves through a
# [wrap-git] entry (subprojects/fortcuh2.wrap -> TheochemUI/fortran_cuh2_src).
# Two CI legs must not take that branch:
#
#   * windows_meson  -- the win-64 pixi env ships flang, so Fortran would be
#     detected; the flang/MSVC CuH2 leg is a separate phase.
#   * nodownload     -- a wrap-git subproject cannot be fetched under
#     `--wrap-mode=nodownload`, and `git archive` carries no checked-out copy.
#
# Naming a fortran binary that cannot be executed makes detection report
# "not found"; `required: false` turns that into `has_fortran = false` instead
# of a configure error.
[binaries]
fortran = 'rgpot-fortran-disabled'
