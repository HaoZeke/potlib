# Meson native file: suppress Fortran language detection.
#
# meson.build gates the Fortran 2018 pot kernels on
# `add_languages('fortran', required: false)`. Use this file only when a
# leg must not take that branch for reasons other than the archiver
# mismatch (for example, a pure C++ smoke).
#
# Windows Flang + MSVC kernels: do NOT use this file. Use
# `win-flang-msvc.ini` instead, which keeps flang and forces `ar = lib` so
# link.exe accepts the static archives.
#
# Naming a fortran binary that cannot be executed makes detection report
# "not found"; `required: false` turns that into `has_fortran = false`.
[binaries]
fortran = 'rgpot-fortran-disabled'
