# Meson native file: Flang kernels + MSVC C++ on Windows.
#
# flang (x86_64-pc-windows-msvc) emits COFF objects that MSVC's link.exe can
# consume, but the flang-shipped llvm-ar wraps them in a GNU archive. link.exe
# then fails with LNK1107 ("invalid or corrupt file") when it opens the .a.
# Force MSVC's librarian (lib.exe) so the static archives are COFF .lib and
# link_whole into librgpot succeeds. eOn's Windows build.bat forces AR=lib
# for the same reason.
#
# Detect flang via PATH (pixi default / conda-forge flang). Do not point
# fortran at a missing binary: that silently disables the kernels.
[binaries]
ar = 'lib'
