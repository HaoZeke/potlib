[project]
name = "rgpot"
version = "2.2.1"
description = "Potential energy surfaces for atomistic simulation (Lennard-Jones core; optional RPC/engines)"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Rohit Goswami", email = "rgoswami@ieee.org" },
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["potential", "Lennard-Jones", "atomistic", "rgpot", "potlib"]

[project.urls]
Homepage = "https://github.com/OmniPotentRPC/rgpot"
Repository = "https://github.com/OmniPotentRPC/rgpot"
Issues = "https://github.com/OmniPotentRPC/rgpot/issues"
Changelog = "https://github.com/OmniPotentRPC/rgpot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ase = ["ase>=3.22"]
test = ["pytest>=7", "numpy>=1.24"]

[build-system]
requires = [
  "meson-python>=0.16",
  "meson>=1.3",
  "ninja",
  "pybind11>=2.11",
  "numpy>=1.24",
]
build-backend = "mesonpy"

# Default wheel: always-on LJ (no Cap'n Proto, no torch, no potserv).
[tool.meson-python.args]
setup = [
  "-Dwith_python=true",
  "-Dwith_rpc=false",
  "-Dwith_rpc_client_only=false",
  "-Dwith_tests=false",
  "-Dwith_examples=false",
  "-Dwith_metatomic=false",
  "-Dwith_xtb=false",
  "-Dwith_tblite=false",
  "-Dwith_rust_core=false",
  "-Dwith_cache=false",
  "-Dwith_eigen=false",
  "-Db_lto=false",
]
install = ["--skip-subprojects"]
dist = ["--include-subprojects"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
